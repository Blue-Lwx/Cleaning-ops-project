                      "primary": "#b9c7e4",
                      "tertiary-fixed": "#5ffbd6",
                      "surface-dim": "#08132a",
                      "inverse-primary": "#515f78",
                      "surface-variant": "#2a344d",
                      "secondary-fixed": "#d8e2ff",
                      "on-primary": "#233148",
                      "surface-container": "#151f37",
                      "surface-bright": "#2f3952",
                      "surface-container-low": "#101b33",
                      "primary-fixed": "#d6e3ff",
                      "on-tertiary-fixed-variant": "#005142",
                      "surface-container-high": "#1f2942",
                      "tertiary-fixed-dim": "#38debb",
                      "on-error-container": "#ffdad6",
                      "surface-container-lowest": "#030d25",
                      "on-tertiary": "#00382d",
                      "on-secondary-container": "#a5b5db",
                      "on-secondary-fixed-variant": "#374767",

                      "on-primary-fixed-variant": "#39475f",

              "spacing": {

<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col selection:bg-tertiary selection:text-on-tertiary">
<!-- TopNavBar Suppression: This is a task-focused transactional screen, so we skip the global shell -->
<main class="flex-grow flex items-center justify-center relative overflow-hidden px-gutter py-12">
<!-- Background Simulation Elements -->
<div class="absolute inset-0 sim-grid opacity-20 pointer-events-none"></div>
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-tertiary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-primary/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="relative w-full max-w-[440px] z-10">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-10">
<a href="home.html"><img alt="CleanOps Academy Logo" class="h-16 w-auto mb-4" src="https://lh3.googleusercontent.com/aida/ADBb0uj55a_tIHXNU_SeQoGf2FwBeenxd0Vqj9-JXGLU-uWVm7TO2_Ob-o-3Nv2tmkDf-y2DXM1HjlipJlvVvJRPQJvl0CVRljVFIOGqg418sm_1iZv_XFyiVVml7q-aba5A0j75kw24ULXkpAMt_8o814cm6H5a5p4cdkRd2BC31vIyidE80EH3OPwBUgFyEEe2ipeu8BQ6GpXbwUZlfjz32YIQP3GDWPUaU0ja__WqyxxzYNCl7lHsJgLgqN8"/></a>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Enterprise Training Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">Simulating operational excellence across your workforce.</p>
</div>
<!-- Login Card -->
<div class="glass-effect rounded-xl p-8 shadow-2xl">
<form class="space-y-6" id="loginForm" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[18px]">mail</span>
                            Email Address
                        </label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary/50 focus:border-tertiary transition-all placeholder:text-on-surface-variant/50" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">lock</span>
                                Password
                            </label>
<a class="font-label-sm text-label-sm text-tertiary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-tertiary/50 focus:border-tertiary transition-all placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-lowest text-tertiary focus:ring-tertiary focus:ring-offset-background cursor-pointer" id="remember" type="checkbox"/>
<label class="ml-2 font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Sign In Button -->
<button class="glow-button w-full bg-tertiary text-on-tertiary font-label-md text-label-md py-4 rounded-lg shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-1 gap-4">
<button class="w-full flex items-center justify-center gap-3 bg-surface-container border border-outline-variant rounded-lg py-3 hover:bg-surface-bright transition-all text-on-surface font-label-md text-label-md" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.27.81-.57z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
                            SSO Single Sign-On
                        </button>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="mt-8 flex justify-center gap-6 font-label-sm text-label-sm text-on-surface-variant">
<a class="hover:text-tertiary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline-variant">|</span>
<a class="hover:text-tertiary transition-colors" href="#">Terms of Service</a>
<span class="text-outline-variant">|</span>
<a class="hover:text-tertiary transition-colors" href="#">Support</a>
</div>
<p class="mt-8 text-center font-label-sm text-label-sm text-on-surface-variant/60">
                © 2024 CleanOps Academy. High-Stakes Professional Simulation.
            </p>
</div>
</main>
<script>
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Validating...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            const email = document.getElementById('email').value.trim();
            const namePart = email.split('@')[0].replace(/[._-]/g, ' ');
            const name = namePart.replace(/\b\w/g, c => c.toUpperCase());
            localStorage.setItem('cleanops_user', JSON.stringify({ name, email }));

            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        });

        // Hover effect for password toggle
        const toggleBtn = document.querySelector('.relative button');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
